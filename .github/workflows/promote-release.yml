name: Promote to full release
run-name: Promote ${{ inputs.tag }} to full release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Pre-release tag to make the full release, for example v1.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to full release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: PROD
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Check and promote
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: master
        run: .github/scripts/promote-release.sh
      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "### ${TAG} is the latest release"
            echo
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
