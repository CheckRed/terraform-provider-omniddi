name: Publish pre-release
run-name: Publish pre-release from VERSION (${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref_name }})

on:
  push:
    branches:
      - master
    paths:
      - VERSION
      - CHANGELOG.md
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Plan from VERSION
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide what to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RELEASE_BRANCH: master
        run: .github/scripts/release-plan.sh

  verify:
    name: Verify
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Vet
        working-directory: src
        run: go vet ./...
      - name: Unit tests
        working-directory: src
        run: |
          TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
          export TF_ACC_TERRAFORM_PATH
          go test ./... -race -timeout 20m
      - name: Scan for known vulnerabilities
        run: make vuln
      - name: Check registry docs are current
        run: make docs-check

  release:
    name: Publish pre-release
    needs:
      - prepare
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: PROD
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true
      - name: Create and push signed tag
        if: needs.prepare.outputs.create_tag == 'true'
        run: |
          git tag -s "$TAG" -m "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
      - name: Extract release notes from CHANGELOG.md
        run: make --no-print-directory release-notes > "$RUNNER_TEMP/release-notes.md"
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.56.0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          distribution: goreleaser
          workdir: src
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src/dist/*.zip
            src/dist/*_SHA256SUMS
            src/dist/*.sbom.json
      - name: Summary
        run: |
          {
            echo "### Published ${TAG} as a pre-release"
            echo
            echo "- Commit: \`${SHA}\`"
            echo "- Pre-release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "- To make it the full release, run the **Promote to full release** workflow with tag \`${TAG}\`."
          } >> "$GITHUB_STEP_SUMMARY"
